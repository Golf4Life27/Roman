# Temporary: measures free-to-use ocean footage. Removed before merge.
name: Ocean probe
on:
  push:
    branches: [claude/ocean-channel]
    paths: [scripts/probe_ocean.py, .github/workflows/probe-ocean.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - run: python scripts/probe_ocean.py

# The weekly cozy video: one scene from the cozy-scenes release, picked for
# the coming week's theme, looped for cozy.hours under original music, with
# the intro and subscribe cards in the first minute (romanfeed/cozy/video.py).
#
# THE PUBLISH SWITCH is cozy.enabled in config/channels/deep-space-ambient.yaml.
# While it is false the job renders a 6-minute preview, keeps it as an
# artifact for three days, and uploads nothing. Turning it on is the owner's call.
#
# Saturday, because the daily render (2 uploads) runs Mon/Wed/Fri: Saturday's
# quota is 4 Shorts x 1,600 + this 1,600 = 8,000 of 10,000.
name: Cozy weekly
on:
  schedule:
    - cron: "23 13 * * 6"   # Saturday 08:23 CDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: render, upload nothing
        type: boolean
        default: true
      hours:
        description: length override (blank = cozy.hours; previews are 0.1)
        default: ""
concurrency:
  group: ledger-writers-cozy
  cancel-in-progress: false
jobs:
  cozy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROMANFEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Font
        run: |
          fc-list | grep -qi "DejaVuSans-Bold" && exit 0
          timeout 180 sudo apt-get install -y -q fonts-dejavu-core || echo "::warning::font install failed"
      - run: pip install -e ".[youtube]"
      - name: Restore ledger
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Write OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Cozy video
        env:
          YOUTUBE_TOKEN_PATH: secrets/youtube.token.json
          DRY_RUN: ${{ inputs.dry_run }}
          HOURS: ${{ inputs.hours }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "$HOURS" ] && args="$args --hours $HOURS"
          python -m romanfeed cozy video $args
      - name: Ledger merge (move ours aside)
        run: mv data/state.db data/mine.db
      - name: Ledger merge (restore newest)
        uses: actions/cache/restore@v4
        with:
          path: data/state.db
          key: ledger-merge-${{ github.run_id }}
          restore-keys: ledger-
      - name: Ledger merge (union)
        run: |
          if [ -f data/state.db ]; then python -m romanfeed ledger-merge data/mine.db --into data/state.db
          else mv data/mine.db data/state.db; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozy-${{ github.run_id }}
          # The preview only: a real upload's 3-hour file is ~4 GB and is on YouTube.
          path: |
            output/cozy/*.jpg
            output/cozy/*.upload.json
            output/cozy/*preview*.mp4
          retention-days: 3
          if-no-files-found: ignore

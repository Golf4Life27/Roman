# TEMPORARY (branch only, removed before merge): proves the ocean lane end to
# end on a real runner -- fetch from Wikimedia Commons, curate, download,
# render a short dry-run video -- and measures the photo supply.
name: Ocean check
on:
  push:
    branches: [claude/ocean-channel]
    paths: [".github/workflows/ocean-check.yml", "romanfeed/**", "config/channels/ocean-ambient.yaml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -e ".[youtube,dev]" || pip install -e ".[youtube]" pytest
      - run: python -m pytest -q
      - name: Supply
        run: python -m romanfeed supply config/channels/ocean-ambient.yaml | sed 's/^/::notice::/'
      - name: Dry-run render (10 photos x 6 s)
        run: |
          python - <<'PY'
          import json, logging
          from pathlib import Path
          from romanfeed.config import load_config
          from romanfeed.pipeline import RunOptions, run
          logging.basicConfig(level=logging.INFO)
          cfg = load_config("config/channels/ocean-ambient.yaml")
          cfg.video.extra_lengths_hours = []
          cfg.publish.mode = "dry-run"
          r = run(cfg, RunOptions(images=10, seconds_per_image=6, dry_run=True, seed="check"))
          body = json.loads(Path(r.metadata_path).read_text())
          print("::notice::title:", body["snippet"]["title"])
          for line in body["snippet"]["description"].splitlines():
              print("DESC|", line)
          print("::notice::rendered", r.n_images, "photos,", round(r.duration_s), "s")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-check-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.thumb.jpg
          retention-days: 3
          if-no-files-found: ignore

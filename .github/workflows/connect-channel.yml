# Upload access for a sibling channel (ocean and the lanes after it), with no
# new secret per channel and nothing passed through chat.
# romanfeed/publish/channel_token.py explains the design.
#
# Default: Google's code-on-another-screen sign-in. The job asks Google for a
# short code (shown as a notice on this run), the owner types it at
# google.com/device, signs in, picks the NEW channel and allows. The job,
# waiting meanwhile (the code lives 30 minutes), receives the token, checks
# the channel by id and by name, refuses Space Screens, and stores it
# encrypted on the channel-tokens release with the confirmed channel id.
# Needs the YOUTUBE_DEVICE_CLIENT secret once: the JSON of a "TVs and Limited
# Input devices" OAuth client in the Space Screens Cloud project.
#
# Start it from Actions (workflow_dispatch) or by pushing connect/<slug>.txt.
# File content: empty or "device" = the code sign-in; "link" = print a
# browser consent link instead (older path); an http://localhost:8765/...
# address = finish that older path.
name: Connect channel
on:
  workflow_dispatch:
    inputs:
      slug:
        description: channel slug (config/channels/<slug>.yaml)
        default: ocean-ambient
      address:
        description: blank = code sign-in (default); "link" = browser consent link; or the localhost address after Allow
        default: ""
  push:
    paths: ["connect/*.txt"]
permissions:
  contents: write   # the channel-tokens release
concurrency:
  group: connect-channel
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -e ".[youtube]"
      - name: Write the Space Screens token (its OAuth client signs the link)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Which channel, which step
        id: req
        env:
          IN_SLUG: ${{ inputs.slug }}
          IN_ADDRESS: ${{ inputs.address }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            f=$(git diff --name-only HEAD~1 HEAD -- 'connect/*.txt' | head -1)
            [ -z "$f" ] && { echo "no connect file changed"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
            [ -f "$f" ] || { echo "$f removed"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
            slug=$(basename "$f" .txt)
            address=$(tr -d '[:space:]' < "$f")
          else
            slug="$IN_SLUG"; address=$(printf '%s' "$IN_ADDRESS" | tr -d '[:space:]')
          fi
          [ -f "config/channels/$slug.yaml" ] || { echo "::error::no config/channels/$slug.yaml"; exit 1; }
          case "$address" in http*) echo "::add-mask::$address";; esac
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          { echo "address<<EOF_ADDR"; echo "$address"; echo "EOF_ADDR"; } >> "$GITHUB_OUTPUT"
      - name: Code sign-in (owner types the code at google.com/device)
        if: steps.req.outputs.skip != 'true' && (steps.req.outputs.address == '' || steps.req.outputs.address == 'device')
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.req.outputs.slug }}
          YOUTUBE_DEVICE_CLIENT: ${{ secrets.YOUTUBE_DEVICE_CLIENT }}
        run: |
          if [ -z "$YOUTUBE_DEVICE_CLIENT" ]; then
            echo "::error title=One-time setup missing::Add the YOUTUBE_DEVICE_CLIENT secret (a TVs and Limited Input devices sign-in key from the Space Screens Google Cloud project)"
            exit 1
          fi
          umask 077
          printf '%s' "$YOUTUBE_DEVICE_CLIENT" > secrets/device_client.json
          python -m romanfeed channel-device-start "$SLUG" --client secrets/device_client.json \
            --state secrets/device_state.json --code-out code.txt
          code=$(sed -n 1p code.txt); where=$(sed -n 2p code.txt)
          echo "::notice title=Enter this code::$code at $where (valid 30 minutes)"
          name=$(python -c "from romanfeed.config import load_config; print(load_config('config/channels/$SLUG.yaml').channel.name)")
          python -m romanfeed channel-device-finish "$SLUG" --client secrets/device_client.json \
            --state secrets/device_state.json --out "$SLUG.token.enc" --channel-out "$SLUG.channel" \
            --expect-title "$name" --not-channel UCUlw1snmaUDAKL965drudgQ
          gh release view channel-tokens >/dev/null 2>&1 || gh release create channel-tokens --prerelease \
            --title "Channel upload access (encrypted)" \
            --notes "Encrypted per-channel upload tokens for sibling channels. Useless without the repository's OAuth client secret. See romanfeed/publish/channel_token.py."
          gh release upload channel-tokens "$SLUG.token.enc" "$SLUG.channel" --clobber
          echo "::notice title=Connected::$SLUG uploads to $name ($(cat "$SLUG.channel"))"
      - name: Consent link
        if: steps.req.outputs.skip != 'true' && steps.req.outputs.address == 'link'
        run: |
          url=$(python -m romanfeed channel-link "${{ steps.req.outputs.slug }}")
          echo "::notice title=Consent link for ${{ steps.req.outputs.slug }}::$url"
          echo "$url"
      - name: Trade the code, check the channel, store the token
        if: steps.req.outputs.skip != 'true' && startsWith(steps.req.outputs.address, 'http')
        env:
          GH_TOKEN: ${{ github.token }}
          ADDRESS: ${{ steps.req.outputs.address }}
          SLUG: ${{ steps.req.outputs.slug }}
        run: |
          python -m romanfeed channel-finish "$SLUG" "$ADDRESS" \
            --out "$SLUG.token.enc" --channel-out "$SLUG.channel" \
            --not-channel UCUlw1snmaUDAKL965drudgQ
          gh release view channel-tokens >/dev/null 2>&1 || gh release create channel-tokens --prerelease \
            --title "Channel upload access (encrypted)" \
            --notes "Encrypted per-channel upload tokens for sibling channels. Useless without the repository's OAuth client secret. See romanfeed/publish/channel_token.py."
          gh release upload channel-tokens "$SLUG.token.enc" "$SLUG.channel" --clobber
          echo "::notice title=Connected::$SLUG uploads to channel $(cat "$SLUG.channel")"

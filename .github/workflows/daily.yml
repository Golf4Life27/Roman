# Daily render + upload.
#
# Gating:
#   * The scheduled run only renders when the repository variable
#     ROMANFEED_ENABLED is "true" (Settings → Secrets and variables → Actions →
#     Variables). Leave it unset until licensed music is registered, so the
#     runner isn't spending 3-4 hours a day on dry-run videos nobody watches.
#   * Manual "Run workflow" always runs. Choose mode "smoke-test" to upload a
#     short PRIVATE [TEST] video (proves token + secret + upload path in CI),
#     or "daily" to do a real run with whatever the channel config says.
#
# The ledger (data/state.db) is persisted through actions/cache so images
# don't repeat across runs. The 1-hour cut is kept 3 days as an artifact; the
# extra-length cuts are not (see the upload step).
#
# Watchdog: set the repository secret HEALTHCHECK_URL to a healthchecks.io ping
# URL and the job reports start / success / failure there, so a run that is
# cancelled outright -- which sends no failure mail -- still raises an alarm.
# Leaving the secret unset disables the pings.
name: Daily render
on:
  schedule:
    # Mon/Wed/Fri, not daily. Three reasons: the image library holds a few
    # weeks of videos and daily burns it; YouTube's policy review rejects
    # "dozens of near-identical videos" as bulk output; and these videos are
    # evergreen, so spacing them lets each accumulate rather than splitting
    # the same searches across more uploads.
    - cron: "0 3 * * 1,3,5"   # 03:00 UTC Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      mode:
        description: smoke-test (short private [TEST] upload) or daily (full run per config)
        type: choice
        options: [smoke-test, daily]
        default: smoke-test
      images:
        description: images per video (override; blank = config)
        default: ""
      seconds:
        description: seconds per image (override; blank = config)
        default: ""
jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROMANFEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Watchdog: healthchecks.io tells us a scheduled run never started or
      # never finished. A cancelled run (billing lockout, runner eviction)
      # produces no failure email of its own, which is how run #21 went
      # unnoticed. The secret is optional -- when HEALTHCHECK_URL is unset
      # every ping is a no-op. Secrets cannot be read in an `if:` expression,
      # so emptiness is tested in the shell instead.
      - name: Ping watchdog (start)
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -z "$HEALTHCHECK_URL" ] && exit 0
          curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/start" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -e ".[youtube]"
      - name: Restore ledger
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Write OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then echo "::warning::YOUTUBE_TOKEN_JSON secret not set; uploads will fail"; fi
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Render
        env:
          YOUTUBE_TOKEN_PATH: secrets/youtube.token.json
        run: |
          mode="${{ inputs.mode || 'daily' }}"
          args=""
          if [ "$mode" = "smoke-test" ]; then
            args="--private-test --images ${{ inputs.images || 6 }} --seconds ${{ inputs.seconds || 8 }}"
          else
            [ -n "${{ inputs.images }}" ] && args="$args --images ${{ inputs.images }}"
            [ -n "${{ inputs.seconds }}" ] && args="$args --seconds ${{ inputs.seconds }}"
          fi
          echo "mode=$mode args=$args"
          python -m romanfeed run config/channels/deep-space-ambient.yaml $args
      - name: Disk report
        if: always()
        # Measured, not guessed: run #21 died without a traceback and we could
        # not tell a full runner disk from a billing cancellation.
        run: df -h / && du -sh output work data/work 2>/dev/null || true
      # Upload the 1h cut only. The extra-length cuts are ~13 GB each, they are
      # already on YouTube by this point, and a private repo gets 0.5 GB of
      # Actions storage -- one 8h artifact blows the cap and every later run
      # then fails on upload. The `!` line excludes anything ending in
      # `-<n>h.mp4` (e.g. deep-space-ambient-2025-09-16-8h.mp4) while keeping
      # the primary deep-space-ambient-2025-09-16.mp4.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}
          path: |
            output/**/*.mp4
            !output/**/*-*h.mp4
            output/**/*.upload.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Ping watchdog (finish)
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$HEALTHCHECK_URL" ] && exit 0
          url="$HEALTHCHECK_URL"
          [ "$JOB_STATUS" = "success" ] || url="$HEALTHCHECK_URL/fail"
          echo "job status: $JOB_STATUS"
          curl -fsS -m 10 --retry 3 "$url" || true

# Daily render + upload.
#
# Gating:
#   * The scheduled run only renders when the repository variable
#     ROMANFEED_ENABLED is "true" (Settings → Secrets and variables → Actions →
#     Variables). Leave it unset until licensed music is registered, so the
#     runner isn't spending 3-4 hours a day on dry-run videos nobody watches.
#   * Manual "Run workflow" always runs. Choose mode "smoke-test" to upload a
#     short PRIVATE [TEST] video (proves token + secret + upload path in CI),
#     or "daily" to do a real run with whatever the channel config says.
#
# The ledger (data/state.db) is persisted through actions/cache so images
# don't repeat across runs. Rendered video is kept 3 days as an artifact.
name: Daily render
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: smoke-test (short private [TEST] upload) or daily (full run per config)
        type: choice
        options: [smoke-test, daily]
        default: smoke-test
      images:
        description: images per video (override; blank = config)
        default: ""
      seconds:
        description: seconds per image (override; blank = config)
        default: ""
jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROMANFEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -e ".[youtube]"
      - name: Restore ledger
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Write OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then echo "::warning::YOUTUBE_TOKEN_JSON secret not set; uploads will fail"; fi
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Render
        env:
          YOUTUBE_TOKEN_PATH: secrets/youtube.token.json
        run: |
          mode="${{ inputs.mode || 'daily' }}"
          args=""
          if [ "$mode" = "smoke-test" ]; then
            args="--private-test --images ${{ inputs.images || 6 }} --seconds ${{ inputs.seconds || 8 }}"
          else
            [ -n "${{ inputs.images }}" ] && args="$args --images ${{ inputs.images }}"
            [ -n "${{ inputs.seconds }}" ] && args="$args --seconds ${{ inputs.seconds }}"
          fi
          echo "mode=$mode args=$args"
          python -m romanfeed run config/channels/deep-space-ambient.yaml $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.upload.json
          retention-days: 3
          if-no-files-found: ignore

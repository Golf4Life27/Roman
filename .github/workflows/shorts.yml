# Vertical Shorts cut from the long videos' best moments.
#
# Three slots a day, one Short per slot, so they land spread across the day
# rather than in a burst. shorts.per_day in the channel config caps the day
# (counted in the ledger), so a re-run or a manual dispatch cannot exceed it.
#
# THE PUBLISH SWITCH is shorts.enabled in config/channels/deep-space-ambient.yaml.
# While it is false, every run renders the Short and its metadata and uploads
# nothing; the files are kept as an artifact for three days so they can be
# watched first. Turning it on is the owner's call.
#
# Quota: each Short is one videos.insert (1,600 units). On a render day the
# daily job spends 2 x 1,600 + 2 x 50, so three Shorts bring the day to about
# 8,100 of the 10,000-unit default.
#
# The ledger travels through the Actions cache, shared with daily.yml: each run
# restores the newest ledger-* entry and saves its own on success. The slots
# sit away from the daily render (which starts around 08:00-09:00 UTC) so the
# two never write it at the same time.
name: Shorts
on:
  schedule:
    - cron: "10 14 * * *"   # 09:10 CDT
    - cron: "10 19 * * *"   # 14:10 CDT
    - cron: "40 23 * * *"   # 18:40 CDT
  workflow_dispatch:
    inputs:
      count:
        description: how many Shorts (still capped by shorts.per_day)
        default: "1"
      dry_run:
        description: render and write metadata, upload nothing
        type: boolean
        default: true
concurrency:
  group: ledger-writers-shorts
  cancel-in-progress: false
jobs:
  shorts:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROMANFEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -e ".[youtube]"
      - name: Restore ledger
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-
      - name: Write OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then echo "::warning::YOUTUBE_TOKEN_JSON secret not set; uploads will fail"; fi
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Cut Shorts
        env:
          YOUTUBE_TOKEN_PATH: secrets/youtube.token.json
          COUNT: ${{ inputs.count || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--count $COUNT"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          python -m romanfeed shorts config/channels/deep-space-ambient.yaml $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-${{ github.run_id }}
          path: |
            output/**/shorts/*.mp4
            output/**/shorts/*.upload.json
          retention-days: 3
          if-no-files-found: ignore

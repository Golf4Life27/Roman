# Tonight's live broadcast (romanfeed/live/schedule.py, docs/LIVE_STREAM.md).
#
# YouTube shows a stream only when a broadcast exists for it, and Studio
# makes one only while its Stream page is open. The server streams to
# Studio's key at 21:00 Chicago; this job creates that night's broadcast
# ahead of time (public, auto-start, auto-stop, bound to the key's stream),
# so YouTube goes live the moment the video arrives.
#
# Several runs a day because GitHub starts scheduled runs late or drops them;
# once tonight's broadcast exists the rest do nothing. Each run also deletes
# our upcoming broadcasts from earlier nights that never went live.
#
# It also makes the broadcast of every live-network lane session starting in
# the next 24 hours (romanfeed/live/lanes.py), for each lane whose key is set.
#
# Needs: secret YOUTUBE_TOKEN_JSON minted with `romanfeed auth --scope manage`
# (an upload-only token gets 403 "insufficient authentication scopes"),
# secret YOUTUBE_STREAM_KEY (Studio's stream key), and for the lanes
# YOUTUBE_STREAM_KEY_2 / YOUTUBE_STREAM_KEY_3 (their own Studio stream keys).
#
# And it keeps the 24/7 stream's one broadcast (romanfeed/live/always.py):
# found by the Studio key's name ("24/7"), so it needs no secret of its own.
# The two night runs are for it: a broadcast YouTube ended overnight is back
# within a few hours, not the next morning.
name: Live broadcast
on:
  schedule:
    - cron: "13 11 * * *"   # 06:13 CDT
    - cron: "13 14 * * *"   # 09:13 CDT
    - cron: "13 17 * * *"   # 12:13 CDT
    - cron: "43 19 * * *"   # 14:43 CDT
    - cron: "13 22 * * *"   # 17:13 CDT
    - cron: "13 3 * * *"    # 22:13 CDT, for the 24/7 stream
    - cron: "13 7 * * *"    # 02:13 CDT, for the 24/7 stream
  workflow_dispatch:
    inputs:
      dry_run:
        description: print what would be created; change nothing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: live-broadcast
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[youtube]"
      - name: Write OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then echo "::error::YOUTUBE_TOKEN_JSON secret not set"; exit 1; fi
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube.token.json
      - name: Schedule tonight
        env:
          YOUTUBE_TOKEN_PATH: secrets/youtube.token.json
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          # The live network's lanes (live.lanes); a lane without its secret is skipped.
          YOUTUBE_STREAM_KEY_2: ${{ secrets.YOUTUBE_STREAM_KEY_2 }}
          YOUTUBE_STREAM_KEY_3: ${{ secrets.YOUTUBE_STREAM_KEY_3 }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -o pipefail
          args=""
          [ "$DRY_RUN" = "true" ] && args="--dry-run"
          python -m romanfeed live schedule $args | tee -a "$GITHUB_STEP_SUMMARY" > schedule.txt
          # Each line also as a notice, readable on the run without opening the log.
          while IFS= read -r line; do echo "::notice::$line"; done < schedule.txt

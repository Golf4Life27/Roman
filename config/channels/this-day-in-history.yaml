# The history channel: TikTok @this.day.in.histoy ("On This Day").
# Three narrated vertical videos a day about the date's events
# (romanfeed/history, docs/HISTORY_CHANNEL.md). Scripts are written from
# Wikipedia's "On this day" facts and fact-checked; images are public domain.
channel:
  slug: this-day-in-history
  name: On This Day
  handle: "@this.day.in.histoy"
  tagline: One day in history, every day.

history:
  per_day: 3

# PUBLISH SWITCH, the owner's call. off: the videos are rendered as run
# artifacts only. test: a TikTok draft in the app's Creator Inbox. on: public.
# Needs the history TikTok connected in Zernio and its account id below.
crosspost:
  mode: "off"
  tiktok_account: ""
  instagram_account: ""
  slots: ["09:30", "13:30", "18:30"]
  timezone: America/Chicago
  made_with_ai: true
  hashtags: ["#history", "#onthisday", "#todayinhistory", "#historyfacts"]

# Fly-into journeys (romanfeed/journey, .github/workflows/journey.yml): one
# real nebula or galaxy image, flown into with depth parallax (a per-pixel
# depth estimate from a small open model; brightness layering if it cannot
# run), a new region revealed every few minutes, music that opens lively and
# settles by calm_minutes. A 1-hour cut plus the extra lengths, which go dark
# after sleep_dark_after_minutes like the daily sleep cuts.
# enabled is the PUBLISH SWITCH and is the owner's call: false, the workflow
# renders previews only and nothing uploads. With it on, the scheduled run
# uploads on each date listed in dates (YYYY-MM-DD, UTC); an empty list means
# every day. Privacy follows publish.privacy.
journey:
  # Test 15 (Nov 18): first 2 fly-into journeys go out on these UTC dates,
  # from the 06:15 UTC run (about 1.5 h to render a 1 h + 8 h pair).
  # Win: click rate 3%+ and 2x the views a day of flat-pan uploads.
  # Kill: under 1x at 14 days.
  enabled: true
  dates: ["2026-11-20", "2026-11-22"]
  hours: 1
  extra_lengths_hours: [8]
  calm_minutes: 20
  sleep_dark_after_minutes: 45
  depth: auto

# Earth-from-orbit videos inside Space Screens (owner approved 2026-10-13).
# On these days the daily render uses only the space-station photos above,
# with Earth titles and narration; every other day stays deep space. If
# fewer than 1.5 videos' worth of fresh Earth photos remain, that day falls
# back to deep space (and the log says so).
# Four days a week from 2026-10-24 (was Friday only): daily long videos need
# more material, and the owner asked for the station's Earth views to carry
# the channel until Roman's images arrive. The deep-space library had about
# 3 videos of never-shown images left on Oct 23; the Earth library holds
# thousands (`romanfeed supply` for today's numbers).
earth:
  weekdays: [tue, thu, fri, sun]

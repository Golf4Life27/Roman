# Flagship channel. Copy this file to spin up a sibling channel (different
# genre or pacing) without touching code.
channel:
  slug: deep-space-ambient
  # Chosen 2026-09-05. Handle @SpaceScreens goes live ~2026-09-19 (YouTube's 14-day hold).
  name: Space Screens
  handle: "@SpaceScreens"
  channel_id: UCUlw1snmaUDAKL965drudgQ
  tagline: Real space telescope imagery, slowly. Hubble and Webb today, Roman when its first images land.

video:
  width: 1920
  height: 1080
  fps: 24                     # sleep content; 24 renders ~20% faster than 30
  seconds_per_image: 45       # 45s x 80 images = 60 minutes
  images_per_video: 80
  transition_seconds: 2.5
  captions: true
  max_zoom: 1.18
  # Reject frames with a solid black block (usually a Hubble WFPC2 detector
  # gap); ~1 in 5 NASA library candidates has one and it reads as a hole.
  max_flat_black: 0.02
  crf: 20
  preset: veryfast            # 80 clips/day; medium is ~2x slower for little visible gain
  # Extra cuts built from the SAME rendered clips -- no re-render, just a concat
  # and a fresh soundtrack. The 8-hour cut is the point: watch hours are what
  # the monetisation gate counts, and one viewer who falls asleep to an 8-hour
  # video banks several times the hours of the same viewer on a 1-hour one.
  # The gate doubles to 8000 hours for new applicants on 2027-02-01, so hours
  # banked before then are worth double.
  # Deliberately just [8], not [3, 8]: two uploads a run at three runs a week is
  # six videos -- enough surface area without looking like bulk output, which is
  # what YouTube's policy review rejects.
  extra_lengths_hours: [8]
  # Every long video opens on the lead image with an intro card naming the
  # object and its telescope (0-12 s), then a subscribe prompt (14-40 s):
  # inside the first minute, because a sleep audience never sees an end screen.
  intro_seconds: 12
  subscribe_from: 14
  subscribe_until: 40
  subscribe_line: Subscribe to travel through time
  # The 8-hour cut shows images for 45 minutes, then fades to black while the
  # music plays on ("dark screen" is what sleep searchers ask for). It also
  # shrinks the 8h file from ~13 GB to about one hour's worth.
  sleep_dark_after_minutes: 45

sources:
  - type: roman               # yields nothing until Roman science images are public; then they take priority
    enabled: true
    min_width: 1600
    options:
      science_after: "2026-12-01"   # Roman launched 2026-08-30; first observations expected early 2027
      allow_pre_launch: false
  - type: nasa_images
    enabled: true
    min_width: 1600
    # 500 from 2026-10-23: daily long videos left about 3 videos of fresh
    # deep-space images; broad terms like "nebula" have far more than 100 hits.
    max_per_query: 500
    # Subject-led, not mission-led: mission queries return hardware and people.
    # Each query is capped at max_per_query, so a broad term like "nebula" throws
    # away everything past its first 100 hits. The narrow terms below are how we
    # reach those -- they deepen the pool, they do not just widen it. Run #13 had
    # only 2 fresh images left out of the whole library; this is the fix for that.
    queries:
      # broad types
      - nebula
      - galaxy
      - star cluster
      - supernova remnant
      - deep field
      - planetary nebula
      - star forming region
      - emission nebula
      - reflection nebula
      - dark nebula
      - stellar nursery
      - globular cluster
      - open star cluster
      - spiral galaxy
      - barred spiral galaxy
      - elliptical galaxy
      - dwarf galaxy
      - irregular galaxy
      - interacting galaxies
      - galaxy merger
      - galaxy cluster
      - starburst galaxy
      - gravitational lensing
      - quasar
      - protoplanetary disk
      # named objects -- distinct result sets the broad terms truncate away
      - Orion Nebula
      - Carina Nebula
      - Eagle Nebula
      - Crab Nebula
      - Helix Nebula
      - Ring Nebula
      - Lagoon Nebula
      - Horsehead Nebula
      - Tarantula Nebula
      - Andromeda galaxy
      - Whirlpool galaxy
      - Sombrero galaxy
      - Pillars of Creation
      - Ultra Deep Field
      # telescope x subject -- each instrument's archive is indexed separately
      - Webb nebula
      - Webb galaxy
      - Webb star cluster
      - Webb deep field
      - Hubble galaxy
      - Hubble nebula
      - Hubble star cluster
      - Spitzer nebula
      - Chandra supernova
  # Second supplier. NASA's library alone is not deep enough: 48 search terms
  # there reach 1212 images, and one hour-long video eats about 78 of them.
  # These archives are a separate collection browsed by category, so a handful
  # of categories returns the whole set rather than the first 100 hits of each
  # phrase. ESA/Hubble alone lists over 5,500 images. Both are CC BY 4.0, and
  # every image's credit already appears in the description.
  - type: esa_archive
    enabled: true
    min_width: 1600
    options:
      base_url: https://esahubble.org
      id_prefix: esa
      label: ESA/Hubble
      categories: [nebulae, galaxies, starclusters, stars, cosmology, blackholes]
  - type: esa_archive
    enabled: true
    min_width: 1600
    options:
      base_url: https://esawebb.org
      id_prefix: esawebb
      label: ESA/Webb
      categories: [nebulae, galaxies, starclusters, stars, cosmology]

  # Earth from orbit (see `earth:` below): photos taken by astronauts on the
  # International Space Station. Public domain (NASA). Tagged at the source, so
  # deep-space videos never show them and Earth videos show nothing else.
  - type: nasa_images
    enabled: true
    min_width: 1600
    # 300, not 100: most Earth searches have hundreds of hits, and daily long
    # videos (from 2026-10-24) need the deeper pool.
    max_per_query: 300
    options:
      subject: earth
    queries:
      - city lights from the international space station
      - the city lights of
      - aurora from the international space station
      - aurora australis
      - aurora borealis space station
      - earth at night from the international space station
      - orbital sunrise
      - orbital sunset
      - earth limb international space station
      - airglow
      - glacier from the international space station
      - desert from the international space station
      - sand dunes from the international space station
      - volcano from the international space station
      - island from the international space station
      - atoll from the international space station
      - hurricane from the international space station
      - typhoon from the international space station
      - river delta from the international space station
      - mountains from the international space station
      - the himalayas
      - the andes mountain range
      - coastline from the international space station
      - clouds from the international space station
      - moon over earth international space station
      - milky way over earth international space station
      - sun glint ocean space station
      - lake from the international space station
      - canyon from the international space station
      - snow covered from the international space station
      - the mediterranean sea
      - the nile river
      - the bahamas from space station
      - the alps from space station
      - the sahara desert
      - the gulf of mexico from space station
      - the pacific ocean from space station
      - the indian ocean from space station
      - the atlantic ocean from space station
      # added 2026-10-23 for daily long videos
      - lightning from the international space station
      - thunderstorm from the international space station
      - noctilucent clouds
      - sunglint
      - the great lakes from space station
      - florida from the international space station
      - japan from the international space station
      - italy from the international space station
      - australia from the international space station
      - africa from the international space station
      - south america from the international space station
      - new zealand from the international space station
      - iceland from the international space station
      - greenland from the international space station
      - the caribbean sea from space station
      - hawaii from the international space station
      - the red sea from space station
      - the persian gulf from space station
      - great barrier reef from space station
      - earth at night city lights europe

audio:
  genre: ambient
  # Original music composed per video by romanfeed/audio/composer.py (licence
  # owned); owner approved 2026-10-01 after listening. `library` = the Suno manifest.
  source: composed
  library: assets/music/manifest.yaml
  fade_seconds: 8            # fade of the whole soundtrack, at each end
  crossfade_seconds: 8       # overlap between consecutive tracks, so no gap at the joins
  gain_db: -6
  allow_placeholder: false    # dry runs override this; uploads never do

publish:
  mode: upload               # flip to `upload` once OAuth is set up and music is licensed
  privacy: public             # owner approved going public 2026-09-18, after three videos were published manually from Studio and verified public
  category_id: "28"           # Science & Technology
  # Tokens: {lead} {subject} {length} {date} {channel}. Titles carry the phrases people actually search
  # ("space video for sleep", "space screensaver"); the channel name only needs the head term.
  # {lead} names the first image in the cut, so every upload gets a unique title -- the same title run
  # after run is what reads as bulk uploads to YouTube.
  # Tokens: {lead} {lead_by} ("Pillars of Creation by Webb") {telescope} {dark_after} {subject} {length}.
  # Name first, sleep phrase at the tail. The Oct 1 title split test measured the
  # sleep-first titles ("1 Hour Relaxing Space Music for Sleep · ...") at 0.59x,
  # 0.58x and 0.62x the views per video per day of these name-first ones over three
  # weekly readings, so new uploads went back to name-first on 2026-10-28. The
  # extra-length sleep cuts use the same shape (blank sleep_title_template).
  title_template: "{lead_by} | {subject} | {length} Relaxing Space Video for Sleep | Telescope Screensaver"
  sleep_title_template: ""
  # Winner-format test, Nov 19-22 (tests.md, romanfeed/winner.py): the Studio
  # export of Nov 18 shows the ten September telescope uploads still carry
  # about two thirds of all watch hours at 4-5% click-through, while most
  # November long uploads sit at 0.5-1.7% (Earth days lowest: 0.6-1.1%). The
  # next four daily pairs (1 h + 8 h) go back to that format: one subject per
  # video, nebulae then galaxies in turn, the September title in full with the
  # name shortened to fit, no Earth days. Win: average click-through at or
  # above 3% once each has 1,000 impressions; under 2% ends it.
  winner_from: "2026-11-19"
  winner_until: "2026-11-22"
  winner_themes: [nebula, galaxy]
  winner_title_template: "{lead} | {subject} | {length} Relaxing Space Video for Sleep | Telescope Screensaver"
  # Remake test, Nov 23: "Cosmic cloudscape | Nebulae | 8 Hours" (Sep 25) is the
  # channel's best video, 943 of its ~2,770 long-form watch hours. A fresh set
  # of never-shown nebula pictures in the same format; the 8 h cut wins with
  # 20+ watch hours in its first 7 days.
  remake_date: "2026-11-23"
  remake_lead: "Cosmic Cloudscapes"
  remake_theme: nebula
  tags:
    - space
    - space video
    - space video for sleep
    - space screensaver
    - relaxing space
    - sleep screen
    - ambient
    - nebula
    - galaxy
    - james webb
    - hubble
    - roman space telescope
    - relaxing
    - screensaver
    - calm
    - focus music

# Vertical Shorts cut from the long videos (see .github/workflows/shorts.yml).
# enabled is the PUBLISH SWITCH and is the owner's call: false renders and
# writes metadata only. Four a day; each links to its full sleep video.
shorts:
  enabled: true               # owner approved 2026-10-01
  # 4 again from 2026-10-31 (owner: "it was shorts"). The Oct 24 cut to 2 was
  # for the upload quota, which no longer binds: uploads have had their own
  # bucket of 100 a day, 1 unit each, since June 2026 (it was 1,600 units of
  # the shared 10,000). Measured in Studio: Shorts made 18.9K of 28.5K views
  # and 71 of 116 subscribers Oct 2-29; Oct 22-24 (4 a day) averaged 2,284
  # views and 6.3 subscribers a day, Oct 26-28 (2 a day) 1,084 and 2.0.
  per_day: 4
  # Shorts test, owner 2026-10-31 ("We could try all shorts for a few days",
  # "ok push it"): 8 a day Oct 31 - Nov 3, then back to 4 by itself. One day
  # added (to Nov 4) because the Earth cap stalled every run from Nov 1 17:45
  # to Nov 2 midday Central: 6 Shorts posted in the first 41 hours, not ~13.
  # Kept at 8 through Monday Nov 9: once it ran at full rate (Nov 2 22:34 to
  # Nov 4 15:30 UTC) the live count went 135 -> 152, about 10 a day against
  # 2 a day the week before. Analytics can only say where those came from by
  # Monday's report, which decides 8 or 4 from then on.
  # Called Nov 9 (tests.md): 8 a day won (5.3 net subs a day vs 2.0 the week
  # before), keep 8. The end date was never moved, so from Nov 10 the channel
  # quietly fell back to 4 a day (found Nov 13: 3-5 Shorts in each 24 hours).
  # Now runs through the Jan 31 goal date.
  test_per_day: 8
  test_until: "2027-01-31"
  # Deep-sky Shorts earned 3.6 subscribers per 1,000 views Oct 22-24, Earth
  # 1.6: Earth gets at most 2 Shorts in any 24 hours.
  # Test Nov 5-11: no Earth Shorts. Nov 1-4 Earth Shorts drew 48-123 views
  # each and 0 subscribers; deep sky 231-267 and all 3. Kill rule: if Shorts
  # average under 200 views each over the week, Earth comes back at 2 a day.
  # Nov 16 call: the kill rule's line was met on paper (deep-sky Shorts
  # averaged 79-89 views, under 200), but Earth drew 48-123 views and 0
  # subscribers Nov 1-4, so bringing it back would not lift views and would
  # cost subscribers. Earth stays off.
  earth_per_day: -1
  # Every other Short in the hook style (owner: the calm read is "educational,
  # but might not be crazy engaging"), tagged hook-style so the Monday report
  # can compare the two. Nov 4: 21 Shorts in, still inside noise (3
  # subscribers between both styles, all calm), so it keeps alternating.
  hook_every: 2
  # Nov 16 call (tests.md): round 2 (Nov 9-15) had 3 subscribers between
  # both styles, inside noise, and round 1 was a draw, so neither style wins
  # and they keep alternating. hook_slots (settings) can split 6 and 2 if a
  # later test names a winner.
  # Nov 16 call (tests.md): galaxies won the subject test, 0.36 subscribers
  # per Short (13 from 36) against nebulae 0.12 and clusters 0.22, so a
  # galaxy image gets a lift when a Short picks its picture.
  subject_weights: {galaxy: 0.10}
  hook_voice: en-US-Chirp3-HD-Puck
  hook_rate: 1.12
  # "Why" test (main chat, under the owner's Nov 4 order to test daily): some
  # Shorts open on a why question that the image's own NASA/ESA caption
  # answers in so many words, with that page linked in the description
  # (romanfeed/why.py). Nov 7 restart: only about 14 images in the whole
  # library carry such an answer, so one pair in eight is a why pair (one
  # calm, one hook: about one why Short a day) and the 7 days count from
  # Nov 7. Kill rule: if why Shorts trail on both views and subscribers per
  # Short after 7 days, stop.
  why_every: 8
  why_until: "2026-11-14"
  # Punch-in opening test, Nov 13-19 (tests.md): every other pair of Shorts
  # opens zoomed in and pulls back to the full frame in its first 1.6 seconds.
  # Called Nov 20 on share watched and subscribers per 1,000 views.
  punch_in_until: "2026-11-19"
  # Anticipation opening test, Nov 21-27 (tests.md): every other pair opens
  # close on the dark beside the brightest thing in the picture, holds, then
  # sweeps it in and pulls back to the full frame by about 2.4 seconds.
  # Called Nov 28 on share watched and subscribers per 1,000 views.
  anticipation_from: "2026-11-21"
  anticipation_until: "2026-11-27"
  # Explainer test (tests.md): one Short on each date answers one question
  # about the pictured object in under a minute, in the caption's own words,
  # with YouTube's synthetic-content disclosure (the voice is text to speech).
  # Never in an anticipation slot. Called Nov 30 on views and subs per 1,000.
  explainer_dates: ["2026-11-21", "2026-11-22", "2026-11-23"]
  # Plain-title test, Nov 16-22 (tests.md): every other run of four Shorts is
  # titled with the picture's name alone, without " | Calm Space for Sleep".
  # Views per Short halved week on week (148 -> 73 for first-time objects,
  # Nov 1-7 vs 8-14) while every Short carried the same tagline. Called Nov 23
  # on live views per Short and subscribers per 1,000 views.
  plain_title_from: "2026-11-16"
  plain_title_until: "2026-11-22"
  # No object twice within 30 days: the 13 repeats Nov 1-15 drew 33-51 views
  # each and no subscribers.
  repeat_days: 30
  # Sky-event Shorts, Nov 18-25 (romanfeed/sky_events.py): 2 of the 8 a day
  # point at something in the next 7 days' sky a viewer can go and see (a
  # full Moon, a launch), with the date in big type from the first frame and
  # the official page that confirms it in the description. Every date is in
  # data/sky_events.yaml, read by hand at NASA, USNO or the launch provider.
  # They take Shorts 0, 6, 11 and 13 of every 16 (shorts.sky_event_slots):
  # one of each hook/calm x opening pair and one of each opening x title
  # pair, so the other tests lose the same number on both sides. Tagged
  # sky-event and kept out of those tests' numbers; called on views per Short
  # and subscribers per 1,000 views against calm-style Shorts.
  sky_event_from: "2026-11-18"
  sky_event_until: "2026-11-25"
  sky_event_per_day: 2
  # Fly-into Shorts, Nov 21-27 (test 16, romanfeed/fly_into.py): 2 of the 8 a
  # day are a 24-second vertical flight into one real galaxy or nebula picture
  # from the library (never used by a Short or a journey), made by the journey
  # code: already moving on frame one, on the first bright region by second 3,
  # ending on a push into the brightest part. Music only, the picture's name as
  # the title ("Flying into the Whirlpool Galaxy"), YouTube only.
  # They take Shorts 2, 4, 9 and 15 of every 16: the four hook/calm x opening
  # x title combinations the sky-event slots leave once each, so with both
  # tests on the other 8 Shorts hold each combination exactly once, and with
  # fly-into alone every pair of tests stays even. Tagged fly-into, never take
  # the hook, punch-in, anticipation or plain-title treatment, and are kept
  # out of those tests' numbers; called on views per Short and subscribers per
  # 1,000 views against calm-style Shorts. If one cannot be made the slot is a
  # normal Short and the log says why.
  fly_into_from: "2026-11-21"
  fly_into_until: "2026-11-27"
  fly_into_per_day: 2
  fly_into_slots: [2, 4, 9, 15]
  seconds: 35
  privacy: public
  title_template: "{lead_by} | Calm Space for Sleep"

# Nightly ~10 h live stream (docs/LIVE_STREAM.md). Switched on by the owner
# on 2026-10-05 after 221 watch hours in 7 days (the rule: 15 a day).
live:
  enabled: true
  # Cozy scene nights (romanfeed/live/scene.py): every other night, plus every
  # holiday/sky-event peak night, the stream loops a seasonal cozy scene from
  # the cozy-scenes release instead of the space videos. "always" or "off"
  # are the other settings. Alternate first, so the two can be compared.
  scenes: always            # TEMPORARY (since 2026-10-08): cozy every night while the stuck
                            # "Preparing stream" is diagnosed (`romanfeed live doctor`); back
                            # to alternate once a regular night streams again
  music_minutes: 60         # composed on the server before the stream; 60 min starts ~5 min sooner
  # Nightly pause test, Nov 18-24 (tests.md): 42 streams drew ~100k impressions
  # at ~1% click-through and 5 subscribers; the Nov 13 Launch Night stream got
  # 40,599 impressions at 0.53%. The 24/7 cozy stream keeps running. Called
  # Nov 25: if channel watch hours per day fall more than 15% against
  # Nov 11-17 (30.6 a day), the nightly stream comes back.
  night_off_from: "2026-11-18"
  # Extended Nov 20 to Dec 27: the Santa's Workshop stream below uses the
  # nightly key until Dec 26. The Nov 25 call now weighs the workshop's hours
  # too; if the night has to come back sooner, it needs a lane key first.
  night_off_until: "2026-12-27"
  # Santa's Workshop (romanfeed/live/workshop.py), Alex's idea on Nov 20: our
  # own animated workshop rooms with a Christmas countdown and original
  # music, made for kids, in two sessions a day of 11.8 h (each saved as a
  # replay). Test 18 in tests.md: called Nov 28.
  workshop:
    enabled: true
    key_env: YOUTUBE_STREAM_KEY
    starts: ["06:00", "18:00"]
    hours: 11.8
    first_day: "2026-11-20"
    last_day: "2026-12-26"
    made_for_kids: true
    # One kids Short a day (an elf room in 30 s with the sleeps-until-Christmas
    # count), Nov 21 - Dec 25, made for kids. The regular Shorts drop from 8
    # to 7 a day over the same dates, so the channel still posts 8. The first
    # one is the launch Short (the assembly line, "Santa's Workshop is LIVE").
    # Day-7 report (Nov 28) compares their views and watch hours to the rest.
    shorts_per_day: 1
    # From Nov 21: the stream merged at 17:30 CT Nov 20 and the server only
    # loads it at the 21:00 CT nightly start, so a 18:30 launch Short saying
    # "live now" would have come before the stream. Regular Shorts stay at 8
    # on Nov 20.
    shorts_from: "2026-11-21"
    shorts_until: "2026-12-25"
  # The live network (romanfeed/live/lanes.py, owner approved 2026-10-20): two
  # more cozy streams beside the 21:00 one, each nearly round the clock as two
  # 11.5 h sessions a day (each ends < 12 h and is saved as a replay), each on
  # its own Studio stream key and always a different scene from the others.
  # Daytime sessions are titled for work & study, evening ones for sleep. A
  # lane does nothing until its key is set: the GitHub secret of the same
  # name (broadcasts) and the server's env (`sudo bash deploy/live/setup.sh
  # lanes`). The server timers fire 10 min before each start: keep
  # deploy/live/romanfeed-lane-*.timer in step with `starts`.
  lanes:
    - id: two
      key_env: YOUTUBE_STREAM_KEY_2
      starts: ["07:30", "19:30"]
      hours: 11.5
    - id: three
      key_env: YOUTUBE_STREAM_KEY_3
      starts: ["01:30", "13:30"]
      hours: 11.5
  # The stream that never ends (romanfeed/live/always.py): one cozy room,
  # around the clock, the season's look. Studio stream key named "24/7";
  # the key goes on the server only (deploy/live/setup.sh always).
  always:
    - id: cozy
      key_name: "24/7"
      key_env: YOUTUBE_STREAM_KEY_247
      music_minutes: 180

# Cozy animated scenes (docs/COZY_SCENES.md).
cozy:
  # PUBLISH SWITCH for the Saturday cozy video (cozy-weekly.yml); the owner's
  # call. false: a 6-minute preview is rendered as an artifact, nothing uploads.
  # Turned on by the owner 2026-10-10: a public 3-hour video every Saturday.
  enabled: true
  hours: 3
  # Runway developer API cap per calendar month (1 credit = $0.01, ~420 per
  # new scene): 2000 = at most $20/month, about 4 new scenes. Nothing is spent
  # until the RUNWAYML_API_SECRET repository secret exists.
  monthly_credits: 2000


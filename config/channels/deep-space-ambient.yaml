# Flagship channel. Copy this file to spin up a sibling channel (different
# genre or pacing) without touching code.
channel:
  slug: deep-space-ambient
  # Chosen 2026-09-05. Handle @SpaceScreens goes live ~2026-09-19 (YouTube's 14-day hold).
  name: Space Screens
  handle: "@SpaceScreens"
  channel_id: UCUlw1snmaUDAKL965drudgQ
  tagline: Real space telescope imagery, slowly. Hubble and Webb today, Roman when its first images land.

video:
  width: 1920
  height: 1080
  fps: 24                     # sleep content; 24 renders ~20% faster than 30
  seconds_per_image: 45       # 45s x 80 images = 60 minutes
  images_per_video: 80
  transition_seconds: 2.5
  captions: true
  max_zoom: 1.18
  # Reject frames with a solid black block (usually a Hubble WFPC2 detector
  # gap); ~1 in 5 NASA library candidates has one and it reads as a hole.
  max_flat_black: 0.02
  crf: 20
  preset: veryfast            # 80 clips/day; medium is ~2x slower for little visible gain
  # Extra cuts built from the SAME rendered clips -- no re-render, just a concat
  # and a fresh soundtrack. The 8-hour cut is the point: watch hours are what
  # the monetisation gate counts, and one viewer who falls asleep to an 8-hour
  # video banks several times the hours of the same viewer on a 1-hour one.
  # The gate doubles to 8000 hours for new applicants on 2027-02-01, so hours
  # banked before then are worth double.
  # Deliberately just [8], not [3, 8]: two uploads a run at three runs a week is
  # six videos -- enough surface area without looking like bulk output, which is
  # what YouTube's policy review rejects.
  extra_lengths_hours: [8]
  # Every long video opens on the lead image with an intro card naming the
  # object and its telescope (0-12 s), then a subscribe prompt (14-40 s):
  # inside the first minute, because a sleep audience never sees an end screen.
  intro_seconds: 12
  subscribe_from: 14
  subscribe_until: 40
  subscribe_line: Subscribe to travel through time
  # The 8-hour cut shows images for 45 minutes, then fades to black while the
  # music plays on ("dark screen" is what sleep searchers ask for). It also
  # shrinks the 8h file from ~13 GB to about one hour's worth.
  sleep_dark_after_minutes: 45

sources:
  - type: roman               # yields nothing until Roman science images are public; then they take priority
    enabled: true
    min_width: 1600
    options:
      science_after: "2026-12-01"   # Roman launched 2026-08-30; first observations expected early 2027
      allow_pre_launch: false
  - type: nasa_images
    enabled: true
    min_width: 1600
    max_per_query: 100
    # Subject-led, not mission-led: mission queries return hardware and people.
    # Each query is capped at max_per_query, so a broad term like "nebula" throws
    # away everything past its first 100 hits. The narrow terms below are how we
    # reach those -- they deepen the pool, they do not just widen it. Run #13 had
    # only 2 fresh images left out of the whole library; this is the fix for that.
    queries:
      # broad types
      - nebula
      - galaxy
      - star cluster
      - supernova remnant
      - deep field
      - planetary nebula
      - star forming region
      - emission nebula
      - reflection nebula
      - dark nebula
      - stellar nursery
      - globular cluster
      - open star cluster
      - spiral galaxy
      - barred spiral galaxy
      - elliptical galaxy
      - dwarf galaxy
      - irregular galaxy
      - interacting galaxies
      - galaxy merger
      - galaxy cluster
      - starburst galaxy
      - gravitational lensing
      - quasar
      - protoplanetary disk
      # named objects -- distinct result sets the broad terms truncate away
      - Orion Nebula
      - Carina Nebula
      - Eagle Nebula
      - Crab Nebula
      - Helix Nebula
      - Ring Nebula
      - Lagoon Nebula
      - Horsehead Nebula
      - Tarantula Nebula
      - Andromeda galaxy
      - Whirlpool galaxy
      - Sombrero galaxy
      - Pillars of Creation
      - Ultra Deep Field
      # telescope x subject -- each instrument's archive is indexed separately
      - Webb nebula
      - Webb galaxy
      - Webb star cluster
      - Webb deep field
      - Hubble galaxy
      - Hubble nebula
      - Hubble star cluster
      - Spitzer nebula
      - Chandra supernova
  # Second supplier. NASA's library alone is not deep enough: 48 search terms
  # there reach 1212 images, and one hour-long video eats about 78 of them.
  # These archives are a separate collection browsed by category, so a handful
  # of categories returns the whole set rather than the first 100 hits of each
  # phrase. ESA/Hubble alone lists over 5,500 images. Both are CC BY 4.0, and
  # every image's credit already appears in the description.
  - type: esa_archive
    enabled: true
    min_width: 1600
    options:
      base_url: https://esahubble.org
      id_prefix: esa
      label: ESA/Hubble
      categories: [nebulae, galaxies, starclusters, stars, cosmology, blackholes]
  - type: esa_archive
    enabled: true
    min_width: 1600
    options:
      base_url: https://esawebb.org
      id_prefix: esawebb
      label: ESA/Webb
      categories: [nebulae, galaxies, starclusters, stars, cosmology]

audio:
  genre: ambient
  # Original music composed per video by romanfeed/audio/composer.py (licence
  # owned); owner approved 2026-10-01 after listening. `library` = the Suno manifest.
  source: composed
  library: assets/music/manifest.yaml
  fade_seconds: 8            # fade of the whole soundtrack, at each end
  crossfade_seconds: 8       # overlap between consecutive tracks, so no gap at the joins
  gain_db: -6
  allow_placeholder: false    # dry runs override this; uploads never do

publish:
  mode: upload               # flip to `upload` once OAuth is set up and music is licensed
  privacy: public             # owner approved going public 2026-09-18, after three videos were published manually from Studio and verified public
  category_id: "28"           # Science & Technology
  # Tokens: {lead} {subject} {length} {date} {channel}. Titles carry the phrases people actually search
  # ("space video for sleep", "space screensaver"); the channel name only needs the head term.
  # {lead} names the first image in the cut, so every upload gets a unique title -- the same title run
  # after run is what reads as bulk uploads to YouTube.
  # Tokens: {lead} {lead_by} ("Pillars of Creation by Webb") {telescope} {dark_after} {subject} {length}.
  # Search shows ~60 characters, so the length and the sleep phrase come first; {lead}
  # keeps every title unique and shrinks to fit 100 characters.
  title_template: "{length} Relaxing Space Music for Sleep · {lead_by} · Telescope Screensaver"
  sleep_title_template: "{length} Deep Sleep Music · Fall Asleep in Space · {lead} · Dark Screen After {dark_after}"
  tags:
    - space
    - space video
    - space video for sleep
    - space screensaver
    - relaxing space
    - sleep screen
    - ambient
    - nebula
    - galaxy
    - james webb
    - hubble
    - roman space telescope
    - relaxing
    - screensaver
    - calm
    - focus music

# Vertical Shorts cut from the long videos (see .github/workflows/shorts.yml).
# enabled is the PUBLISH SWITCH and is the owner's call: false renders and
# writes metadata only. Four a day; each links to its full sleep video.
shorts:
  enabled: true               # owner approved 2026-10-01
  per_day: 4                # 4 Shorts + 2 uploads = ~9,700 of the 10,000 daily quota on render days
  seconds: 35
  privacy: public
  title_template: "{lead_by} | Calm Space for Sleep"

# Nightly ~10 h live stream (docs/LIVE_STREAM.md). Switched on by the owner
# on 2026-10-05 after 221 watch hours in 7 days (the rule: 15 a day).
live:
  enabled: true
  # Cozy scene nights (romanfeed/live/scene.py): every other night, plus every
  # holiday/sky-event peak night, the stream loops a seasonal cozy scene from
  # the cozy-scenes release instead of the space videos. "always" or "off"
  # are the other settings. Alternate first, so the two can be compared.
  scenes: alternate

# Cozy animated scenes (docs/COZY_SCENES.md).
cozy:
  # PUBLISH SWITCH for the Saturday cozy video (cozy-weekly.yml); the owner's
  # call. false: a 6-minute preview is rendered as an artifact, nothing uploads.
  enabled: false
  hours: 3
  # Runway developer API cap per calendar month (1 credit = $0.01, ~420 per
  # new scene): 2000 = at most $20/month, about 4 new scenes. Nothing is spent
  # until the RUNWAYML_API_SECRET repository secret exists.
  monthly_credits: 2000

# Cross-posting each Short's social cut to TikTok @spacescreens and Instagram
# @space.screens through Zernio (romanfeed/crosspost.py, docs/CROSSPOST.md).
# mode is the PUBLISH SWITCH, the owner's call: off renders the social cuts
# as artifacts only; test posts to TikTok privately ("only me"); on posts both,
# public, at the slots below (Central time).
crosspost:
  mode: "off"
  tiktok_account: 6ac840f23cbc6e876b0c5083      # Zernio account ids, not secrets
  instagram_account: 6ac846d0baf8dfa25ccbe8a9
  slots: ["12:00", "19:00", "21:30", "23:30"]
